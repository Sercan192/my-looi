name: Build My LOOI APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - run: |
          mkdir -p ~/.config/my-looi/signing
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore ~/.config/my-looi/signing/my-looi-release.keystore \
            -alias mylooi -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=MyLOOI, OU=Dev, O=MyLOOI, L=Istanbul, S=Istanbul, C=TR"
          echo "MY_LOOI_RELEASE_KEYSTORE=$HOME/.config/my-looi/signing/my-looi-release.keystore" >> $GITHUB_ENV
          echo "MY_LOOI_RELEASE_KEY_ALIAS=mylooi" >> $GITHUB_ENV
          echo "MY_LOOI_RELEASE_STORE_PASSWORD=123456" >> $GITHUB_ENV
          echo "MY_LOOI_KEY_PASSWORD=123456" >> $GITHUB_ENV
      - run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/pnpm test/echo "skip tests"/g' scripts/build-android-apk.sh
          bash scripts/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: my-looi-xiaozhi-apk
          path: output/android/*.apk
